[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genox"
version = "0.2.3"
description = "genox - extremely simple static site generator"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "oxalorg", email = "mitesh@oxal.org"},
]
maintainers = [
    {name = "oxalorg", email = "mitesh@oxal.org"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Text Processing :: Markup :: Markdown",
]
keywords = ["static-site-generator", "blog", "markdown", "jinja2", "genox"]
dependencies = [
    "feedgen>=1.0.0",
    "jinja2>=3.1.6",
    "markdown2>=2.5.4",
    "pyyaml>=6.0.2",
    "pygments>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/oxalorg/genox"
Repository = "https://github.com/oxalorg/genox"
Issues = "https://github.com/oxalorg/genox/issues"

[project.scripts]
genox = "genox:cli"

[tool.hatch.build]
include = [
    "genox.py",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
